<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Burnpur SAIL — Consolidated EPC Schedule</title>
<meta name="robots" content="noindex,nofollow">
<style>:root{
  --brand:#31752f;--brand-d:#265c25;--brand-l:#e3efe2;--brand-ink:#ffffff;
  --bg:#ffffff;--chrome:#f3f3f3;--chrome-2:#e9e9e9;--panel:#fafafa;--line:#d4d4d4;--grid:#e3e3e3;--grid-strong:#c8c8c8;
  --text:#262626;--muted:#6b6b6b;--faint:#9a9a9a;--hover:#e5f1e4;--sel:#d5e8d3;--selcell:#31752f;--head:#f0f0f0;--nonwork:#f2f2f2;
  --bar:#5b8fd6;--bar-d:#1f4e8c;--crit:#d83b3b;--crit-d:#8e1c1c;--done:#3e9a4a;--done-d:#1f5f28;--late:#ee8a1d;--late-d:#97520a;
  --base:#a9a9a9;--sum:#2c2c2c;--ms:#111111;--link:#5a6f8f;--status:#d83b3b;--today:#2f7bd6;
  --ok:#3e9a4a;--warn:#e0a000;--bad:#d83b3b;--shadow:0 6px 24px rgba(0,0,0,.18);
  --font:"Segoe UI","Segoe UI Variable",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
  --rowh:22px;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#3d8a3a;--brand-d:#2f6e2d;--brand-l:#24361f;--bg:#1e1e1e;--chrome:#2a2a2a;--chrome-2:#333;--panel:#242424;--line:#3d3d3d;--grid:#323232;--grid-strong:#444;
  --text:#e8e8e8;--muted:#a8a8a8;--faint:#777;--hover:#2c3b2a;--sel:#30472d;--selcell:#7cc477;--head:#2b2b2b;--nonwork:#262626;
  --sum:#d9d9d9;--ms:#f2f2f2;--base:#7a7a7a;--link:#93a6c4;color-scheme:dark}}
:root[data-theme="dark"]{--brand:#3d8a3a;--brand-d:#2f6e2d;--brand-l:#24361f;--bg:#1e1e1e;--chrome:#2a2a2a;--chrome-2:#333;--panel:#242424;--line:#3d3d3d;--grid:#323232;--grid-strong:#444;
  --text:#e8e8e8;--muted:#a8a8a8;--faint:#777;--hover:#2c3b2a;--sel:#30472d;--selcell:#7cc477;--head:#2b2b2b;--nonwork:#262626;--sum:#d9d9d9;--ms:#f2f2f2;--base:#7a7a7a;--link:#93a6c4;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:12px/1.35 var(--font);overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--selcell);outline-offset:1px}
#app{display:flex;flex-direction:column;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* title bar + QAT */
.titlebar{display:flex;align-items:center;height:32px;background:var(--brand);color:var(--brand-ink);padding:0 6px;gap:4px;flex:none}
.qat{display:flex;align-items:center;gap:1px}
.qat button{width:28px;height:26px;border:0;background:transparent;color:inherit;border-radius:2px;display:grid;place-items:center}
.qat button:hover:not(:disabled){background:rgba(255,255,255,.18)}
.qat button:disabled{opacity:.45;cursor:default}
.qat .sep{width:1px;height:16px;background:rgba(255,255,255,.35);margin:0 4px}
.title{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.title b{font-weight:600}
.savestate{font-size:11px;opacity:.85;padding:0 6px;white-space:nowrap}
.userchip{display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:2px;background:rgba(0,0,0,.15);white-space:nowrap;border:0;color:inherit;font-size:11.5px}
.userchip .av{width:18px;height:18px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:10px}

/* tabs + ribbon */
.tabs{display:flex;align-items:flex-end;background:var(--brand);height:27px;padding:0 4px;gap:1px;flex:none;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--brand-ink);padding:4px 14px 5px;font-size:12px;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.14)}
.tab.file{background:var(--brand-d);margin-right:4px}
.tab.on{background:var(--chrome);color:var(--brand);font-weight:600}
.tellme{margin-left:auto;align-self:center;display:flex;align-items:center;gap:6px;padding:0 8px;height:21px;border-radius:2px;color:rgba(255,255,255,.9);min-width:230px;background:rgba(0,0,0,.12);border:0;text-align:left}
.tellme:hover{background:rgba(0,0,0,.22)}
.ribbon{display:flex;align-items:stretch;background:var(--chrome);border-bottom:1px solid var(--line);height:92px;padding:3px 4px 0;flex:none;overflow-x:auto;overflow-y:hidden}
.grp{display:flex;flex-direction:column;border-right:1px solid var(--line);padding:0 6px;flex:none}
.grp .items{flex:1;display:flex;align-items:flex-start;gap:2px}
.grp .gl{font-size:11px;color:var(--muted);text-align:center;padding:1px 0 3px;white-space:nowrap}
.rb{border:1px solid transparent;background:transparent;border-radius:2px;display:flex;align-items:center;gap:4px;padding:2px 5px;white-space:nowrap;font-size:11.5px;color:var(--text)}
.rb:hover:not(:disabled){background:var(--hover);border-color:#c4dcc1}
.rb.on{background:var(--sel);border-color:#a9cba5}
.rb:disabled{opacity:.4;cursor:default}
.rb.big{flex-direction:column;justify-content:flex-start;padding:3px 6px;height:66px;min-width:48px;line-height:1.15;text-align:center}
.rb.big svg{width:30px;height:30px;margin-bottom:3px}
.rb svg{width:16px;height:16px;flex:none}
.col3{display:flex;flex-direction:column;gap:1px}
.pctrow{display:flex;gap:1px}
.pctrow .rb{padding:2px 3px}
.rsel{height:22px;border:1px solid var(--line);background:var(--bg);border-radius:2px;padding:0 4px;font-size:11.5px}
.chk{display:flex;align-items:center;gap:5px;padding:2px 4px;font-size:11.5px;white-space:nowrap}

/* work area */
.work{flex:1;display:flex;min-height:0;position:relative}
.viewbar{width:22px;flex:none;background:var(--chrome-2);border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.viewbar span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600;white-space:nowrap}
#view{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.sheettabs{display:flex;align-items:stretch;background:var(--chrome);border-top:1px solid var(--line);height:26px;flex:none;overflow-x:auto;scrollbar-width:thin}
.stab{border:0;border-right:1px solid var(--line);background:transparent;padding:0 12px;white-space:nowrap;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stab:hover{background:var(--hover);color:var(--text)}
.stab.on{background:var(--bg);color:var(--brand);font-weight:600;box-shadow:inset 0 -2px 0 var(--brand)}
.stab .dot{width:7px;height:7px;border-radius:50%}
.stab.all{font-weight:600;color:var(--text)}
.statusbar{display:flex;align-items:center;gap:14px;height:22px;background:var(--chrome-2);border-top:1px solid var(--line);padding:0 10px;font-size:11px;color:var(--muted);flex:none;white-space:nowrap;overflow:hidden}
.statusbar .sp{flex:1}
.statusbar button{border:0;background:transparent;padding:0 4px;height:20px;color:inherit;display:flex;align-items:center}
.statusbar button:hover{background:var(--hover)}
.statusbar input[type=range]{width:110px;accent-color:var(--brand)}

/* gantt */
.gantt{flex:1;display:flex;min-height:0;position:relative;background:var(--bg)}
.gpane{display:flex;flex-direction:column;min-width:0;position:relative}
.gridpane{flex:none;border-right:1px solid var(--grid-strong)}
.chartpane{flex:1}
.ghead{height:40px;flex:none;overflow:hidden;background:var(--head);border-bottom:1px solid var(--grid-strong);position:relative}
.ghead .hrow{display:flex;height:40px;position:relative}
.hc{flex:none;border-right:1px solid var(--grid);display:flex;align-items:flex-end;padding:0 4px 4px;font-weight:600;font-size:11.5px;position:relative;user-select:none;line-height:1.15}
.hc .rz{position:absolute;right:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:2}
.gbody{flex:1;overflow:auto;position:relative}
.gridpane .gbody{overflow-x:auto;overflow-y:auto;scrollbar-width:thin}
.grow{display:flex;height:var(--rowh);border-bottom:1px solid var(--grid);position:relative;background:var(--bg)}
.grow:hover{background:var(--hover)}
.grow.sel{background:var(--sel)}
.grow.sum .c-name{font-weight:600}
.gc{flex:none;border-right:1px solid var(--grid);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:calc(var(--rowh) - 1px);position:relative}
.gc.r{text-align:right}
.gc.cur{outline:2px solid var(--selcell);outline-offset:-2px;z-index:1}
.gc.id{background:var(--head);text-align:center;color:var(--muted);cursor:grab;font-size:11px}
.grow.sel .gc.id{background:var(--sel);color:var(--text);font-weight:600}
.gc.ind{text-align:center;padding:0;color:var(--muted);font-size:11px}
.gc.ro{color:var(--muted)}
.nm{display:flex;align-items:center;gap:2px;overflow:hidden}
.nm .tw{width:14px;height:14px;border:0;background:transparent;padding:0;display:grid;place-items:center;color:var(--muted);flex:none}
.nm .tw svg{width:9px;height:9px}
.nm .t{overflow:hidden;text-overflow:ellipsis}
.gc input,.gc select{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0 4px;background:var(--bg);outline:2px solid var(--selcell);outline-offset:-2px;font-size:12px}
.ghead.timescale .tier{position:absolute;left:0;height:20px;display:block}
.tcell{position:absolute;top:0;height:20px;border-right:1px solid var(--grid);font-size:11px;padding:3px 4px 0;white-space:nowrap;overflow:hidden;color:var(--text);font-weight:500}
.tier.t2 .tcell{font-weight:400;color:var(--muted);text-align:center;padding:3px 0 0}
.tier.t2{top:20px;border-top:1px solid var(--grid)}
.chartpane .gbody svg{display:block}
.splitter{width:5px;flex:none;cursor:col-resize;background:var(--chrome-2);border-right:1px solid var(--line);border-left:1px solid var(--line);touch-action:none}
.splitter:hover,.splitter.drag{background:var(--brand-l)}
.bar{cursor:move}
.bar.ro{cursor:pointer}
.rzh{cursor:ew-resize}
.prh{cursor:col-resize}
.tip{position:fixed;z-index:60;background:var(--bg);color:var(--text);border:1px solid var(--grid-strong);box-shadow:var(--shadow);padding:6px 8px;font-size:11.5px;pointer-events:none;max-width:320px;line-height:1.45}
.tip b{display:block;margin-bottom:2px}
.tip table{border-collapse:collapse}
.tip td{padding:0 8px 0 0;white-space:nowrap}
.tip td:first-child{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* context menu */
.ctx{position:fixed;z-index:70;background:var(--bg);border:1px solid var(--grid-strong);box-shadow:var(--shadow);padding:3px 0;min-width:210px;font-size:12px}
.ctx button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:4px 22px 4px 10px;text-align:left}
.ctx button:hover:not(:disabled){background:var(--hover)}
.ctx button:disabled{opacity:.4}
.ctx button svg{width:14px;height:14px}
.ctx .k{margin-left:auto;color:var(--faint);font-size:11px;padding-left:16px}
.ctx hr{border:0;border-top:1px solid var(--grid);margin:3px 0}

/* dialogs */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;padding:12px}
.dlg{background:var(--bg);color:var(--text);border:1px solid var(--brand);box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column}
.dlg.wide{width:min(900px,100%)}
.dlg header{display:flex;align-items:center;padding:8px 12px;font-size:13px;font-weight:600;border-bottom:1px solid var(--grid)}
.dlg header .x{margin-left:auto;border:0;background:transparent;width:26px;height:26px;font-size:16px;color:var(--muted)}
.dlg header .x:hover{background:var(--hover)}
.dlg .body{padding:12px;overflow:auto;flex:1}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--grid);background:var(--panel)}
.btn{border:1px solid var(--grid-strong);background:var(--bg);padding:5px 14px;border-radius:2px;min-width:76px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand-d)}
.btn.pri:hover{background:var(--brand-d)}
.btn:disabled{opacity:.5;cursor:default}
.dtabs{display:flex;gap:0;border-bottom:1px solid var(--grid);margin:-12px -12px 12px;padding:0 8px;background:var(--panel)}
.dtabs button{border:0;background:transparent;padding:7px 12px;border-bottom:2px solid transparent}
.dtabs button.on{border-bottom-color:var(--brand);color:var(--brand);font-weight:600}
.form{display:grid;grid-template-columns:130px 1fr;gap:8px 10px;align-items:center}
.form.two{grid-template-columns:120px 1fr 120px 1fr}
.form label{color:var(--muted)}
.form input,.form select,.form textarea,.fi{border:1px solid var(--grid-strong);background:var(--bg);padding:4px 6px;border-radius:2px;min-width:0;width:100%}
.form textarea{min-height:120px;resize:vertical}
.hint{color:var(--muted);font-size:11.5px;margin:8px 0 0}
.warnbox{background:#fff6e0;color:#5a4300;border:1px solid #f0d58a;padding:8px 10px;margin:0 0 10px;font-size:11.5px}
:root[data-theme="dark"] .warnbox{background:#3a3220;color:#f3dd9f;border-color:#6b5a2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warnbox{background:#3a3220;color:#f3dd9f;border-color:#6b5a2a}}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:var(--head);text-align:left;font-weight:600;padding:4px 6px;border:1px solid var(--grid);white-space:nowrap}
.tbl td{padding:3px 6px;border:1px solid var(--grid);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl input,.tbl select{border:1px solid transparent;background:transparent;width:100%;padding:2px 3px}
.tbl input:focus,.tbl select:focus{border-color:var(--selcell);background:var(--bg)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.lnk{border:0;background:transparent;color:var(--brand);padding:0;text-decoration:underline;text-underline-offset:2px}
:root[data-theme="dark"] .lnk{color:#8fd08a}

/* sheet grid (resource sheet etc.) */
.sheet{flex:1;overflow:auto;background:var(--bg)}
.sheet table{border-collapse:collapse;font-size:12px;min-width:100%}
.sheet th{position:sticky;top:0;background:var(--head);z-index:1;font-weight:600;text-align:left;padding:0 6px;height:30px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid-strong);white-space:nowrap}
.sheet td{height:var(--rowh);padding:0 6px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);white-space:nowrap;position:relative}
.sheet td.id{background:var(--head);color:var(--muted);text-align:center;width:36px}
.sheet td.r{text-align:right}
.sheet tr.over td{color:var(--bad)}
.sheet tr:hover td{background:var(--hover)}
.sheet td.cur{outline:2px solid var(--selcell);outline-offset:-2px}
.sheet td input,.sheet td select{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0 6px;background:var(--bg);outline:2px solid var(--selcell);outline-offset:-2px}
.toolrow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--grid);background:var(--panel);flex:none;flex-wrap:wrap}
.toolrow h2{font-size:14px;margin:0 8px 0 0;font-weight:600}
.toolrow .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.green{background:#dff3e1;color:#1f6b2a}.pill.amber{background:#fff0cc;color:#7a5200}.pill.red{background:#fde0de;color:#9b1c1c}.pill.grey{background:var(--chrome-2);color:var(--muted)}.pill.blue{background:#e1ecfa;color:#1f4e8c}
:root[data-theme="dark"] .pill.green{background:#1f3b23;color:#9be0a3}:root[data-theme="dark"] .pill.amber{background:#3d3115;color:#f5d27a}:root[data-theme="dark"] .pill.red{background:#45201e;color:#ffaaa3}:root[data-theme="dark"] .pill.blue{background:#1d2c44;color:#9cc0f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.green{background:#1f3b23;color:#9be0a3}:root:not([data-theme="light"]) .pill.amber{background:#3d3115;color:#f5d27a}:root:not([data-theme="light"]) .pill.red{background:#45201e;color:#ffaaa3}:root:not([data-theme="light"]) .pill.blue{background:#1d2c44;color:#9cc0f5}}

/* dashboard / portfolio / reports */
.scroll{flex:1;overflow:auto;background:var(--panel)}
.dash{padding:12px;display:grid;gap:12px;grid-template-columns:repeat(12,1fr);max-width:1500px}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--grid);border:1px solid var(--grid)}
.kpi{background:var(--bg);padding:10px 12px}
.kpi .v{font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:11.5px;margin-top:2px}
.kpi .s{font-size:11px;color:var(--faint);margin-top:3px}
.card{background:var(--bg);border:1px solid var(--grid);display:flex;flex-direction:column;min-width:0}
.card h3{margin:0;font-size:12.5px;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--grid);display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--muted)}
.card .cb{padding:8px 10px;overflow:auto}
.chart{height:280px;width:100%}
.s6{grid-column:span 6}.s4{grid-column:span 4}.s8{grid-column:span 8}.s12{grid-column:1/-1}
@media (max-width:1100px){.s6,.s4,.s8{grid-column:1/-1}}
.prog{height:8px;background:var(--chrome-2);position:relative;min-width:60px}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--done)}
.prog b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text)}
.paper{background:#fff;color:#1d1d1d;max-width:900px;margin:16px auto;padding:28px 34px;border:1px solid var(--grid);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.paper h1{font-size:18px;margin:0 0 2px}
.paper h2{font-size:13.5px;margin:20px 0 6px;color:#265c25;border-bottom:1px solid #cfe1cd;padding-bottom:3px}
.paper .meta{color:#666;font-size:11.5px;margin-bottom:10px}
.paper .tbl th{background:#f0f4ef;color:#1d1d1d;border-color:#dadada}
.paper .tbl td{border-color:#e2e2e2;color:#1d1d1d}
.paper p{margin:4px 0;line-height:1.5}
.replist{display:flex;gap:6px}

/* copilot */
.copilot{width:360px;flex:none;border-left:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column}
.copilot header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--grid);font-weight:600;background:var(--panel)}
.copilot header .x{margin-left:auto;border:0;background:transparent;width:24px;height:24px;color:var(--muted)}
.cplog{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:100%;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--brand-l);padding:6px 10px;border-radius:10px 10px 2px 10px;max-width:85%}
.msg.a{align-self:stretch}
.msg.a .tbl{margin-top:6px;font-size:11.5px}
.msg.a ul{margin:4px 0;padding-left:18px}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;border-top:1px solid var(--grid)}
.chip{border:1px solid var(--grid-strong);background:var(--bg);border-radius:12px;padding:2px 9px;font-size:11.5px}
.chip:hover{background:var(--hover)}
.cpin{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--grid)}
.cpin textarea{flex:1;border:1px solid var(--grid-strong);background:var(--bg);resize:none;height:54px;padding:5px 7px;border-radius:2px}
.dots::after{content:"…";animation:blink 1s steps(3) infinite}
@keyframes blink{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}

/* backstage */
.backstage{position:absolute;inset:0;z-index:40;display:flex;background:var(--bg)}
.bsnav{width:200px;background:var(--brand);color:#fff;display:flex;flex-direction:column;padding:10px 0;flex:none}
.bsnav button{border:0;background:transparent;color:#fff;text-align:left;padding:9px 22px;font-size:13px}
.bsnav button:hover{background:rgba(255,255,255,.14)}
.bsnav button.on{background:var(--brand-d)}
.bsnav .back{font-size:20px;padding:4px 18px 12px}
.bsbody{flex:1;overflow:auto;padding:24px 34px}
.bsbody h1{font-weight:300;font-size:28px;margin:0 0 18px}
.bsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;max-width:900px}
.bscard{border:1px solid var(--grid);background:var(--bg);padding:12px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.bscard:hover{background:var(--hover);border-color:#a9cba5}
.bscard svg{width:28px;height:28px;flex:none;color:var(--brand)}
.bscard b{display:block;margin-bottom:2px}
.bscard span{color:var(--muted);font-size:11.5px}
.drop{border:2px dashed var(--grid-strong);padding:26px;text-align:center;color:var(--muted);margin:10px 0}
.drop.over{border-color:var(--brand);background:var(--brand-l)}

.toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#323232;color:#fff;padding:7px 14px;border-radius:3px;z-index:90;font-size:12px;box-shadow:var(--shadow);max-width:90vw}
.toast.err{background:#9b1c1c}

@media (max-width:760px){
  .tellme{min-width:0}.tellme span{display:none}
  .ribbon{height:84px}
  .rb.big{height:60px;min-width:42px}
  .viewbar{display:none}
  .copilot{position:absolute;inset:0;width:auto;z-index:30}
  .title{font-size:11.5px}
  .savestate{display:none}
  .form,.form.two{grid-template-columns:1fr}
  .bsnav{width:120px}.bsbody{padding:16px}
}
.bar:hover .prh{opacity:.9}
.tellme svg{width:14px;height:14px;flex:none}
.msgbar{display:flex;align-items:center;gap:10px;padding:5px 10px;background:#fff6e0;color:#5a4300;border-bottom:1px solid #f0d58a;font-size:11.5px;flex:none}
.msgbar .btn{padding:2px 10px;min-width:0}
.msgbar .x{margin-left:auto;border:0;background:transparent;color:inherit;font-size:14px}
:root[data-theme="dark"] .msgbar{background:#3a3220;color:#f3dd9f;border-color:#6b5a2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msgbar{background:#3a3220;color:#f3dd9f;border-color:#6b5a2a}}
.copilot header svg{width:16px;height:16px;flex:none}
.copilot{width:400px}
@media (max-width:760px){.userchip .un{display:none}}

/* ---- sign-in ---- */
.login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,var(--brand-d),var(--brand) 55%,#4f9a4b);overflow:auto}
.lg-card{background:var(--bg);color:var(--text);width:min(420px,100%);border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.28);padding:26px 28px 18px}
.lg-brand{display:flex;gap:12px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--grid);margin-bottom:16px}
.lg-brand svg{width:38px;height:38px;color:var(--brand);flex:none}
.lg-brand b{display:block;font-size:14px;line-height:1.3}
.lg-brand span{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.lg-card h1{font-size:20px;font-weight:600;margin:0 0 12px}
.lg-card label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.lg-card input{width:100%;border:1px solid var(--grid-strong);background:var(--bg);border-radius:3px;padding:8px 10px;font-size:13.5px}
.lg-card input:focus{outline:2px solid var(--selcell);outline-offset:-1px}
.lg-pw{display:flex;gap:6px}.lg-pw button{border:1px solid var(--grid-strong);background:var(--panel);border-radius:3px;padding:0 10px;font-size:12px}
.lg-err{color:var(--bad);min-height:18px;margin:8px 0 4px;font-size:12px}
.lg-go{width:100%;padding:9px;font-size:13.5px;margin-top:4px}
.lg-foot{color:var(--faint);font-size:11px;margin:16px 0 0;line-height:1.5}
/* ---- executive summary ---- */
.sm-page{max-width:1240px;margin:14px auto 24px;background:var(--bg);border:1px solid var(--grid);box-shadow:0 2px 12px rgba(0,0,0,.06);padding:26px 30px 18px}
.sm-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;border-bottom:3px solid var(--brand);padding-bottom:14px;flex-wrap:wrap}
.sm-kicker{text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;color:var(--brand);font-weight:700}
.sm-head h1{font-size:22px;margin:4px 0 2px;font-weight:600}
.sm-sub{color:var(--muted);font-size:12.5px}
.sm-meta{display:flex;gap:18px;flex-wrap:wrap}
.sm-meta div{display:flex;flex-direction:column;font-size:12px}.sm-meta span{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.sm-status{display:flex;gap:16px;align-items:stretch;margin:16px 0;border:1px solid var(--grid);border-left-width:6px}
.sm-status p{margin:0;padding:10px 14px 10px 0;line-height:1.6;font-size:13px}
.sm-rag{min-width:130px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center}
.sm-rag span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.sm-rag b{font-size:18px}
.sm-green{border-left-color:var(--ok)}.sm-green .sm-rag b{color:var(--ok)}
.sm-amber{border-left-color:var(--warn)}.sm-amber .sm-rag b{color:#b07d00}
.sm-red{border-left-color:var(--bad)}.sm-red .sm-rag b{color:var(--bad)}
.sm-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--grid);border:1px solid var(--grid);margin-bottom:14px}
.sm-kpi{background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sm-kpi span{font-size:11px;color:var(--muted)}.sm-kpi b{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}.sm-kpi em{font-style:normal;font-size:11px;color:var(--faint)}
.sm-bar{position:relative;height:8px;background:var(--chrome-2);border-radius:4px;margin-top:4px;min-width:60px}
.sm-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--done);border-radius:4px}
.sm-bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text)}
.sm-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.sm-card{border:1px solid var(--grid);min-width:0;break-inside:avoid}
.sm-card h3{margin:0;font-size:12.5px;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--grid);background:var(--panel);display:flex;gap:8px;align-items:baseline}
.sm-card h3 small{font-weight:400;color:var(--muted)}
.sm-card > .chart,.sm-card > svg,.sm-card > .sm-legend{margin:8px 10px}
.sm-tbl{font-size:12px}.sm-tbl td:not(:first-child){white-space:nowrap}.sm-tbl th,.sm-tbl td{border-left:0;border-right:0}.sm-tbl tr.sm-total td{font-weight:600;background:var(--panel)}
.sm-w12{grid-column:1/-1}.sm-w8{grid-column:span 8}.sm-w7{grid-column:span 7}.sm-w6{grid-column:span 6}.sm-w5{grid-column:span 5}.sm-w4{grid-column:span 4}
.sm-tl{width:calc(100% - 20px);height:auto;display:block}
.sm-legend{display:flex;gap:14px;font-size:11px;color:var(--muted)}.sm-legend i{display:inline-block;width:14px;height:8px;margin-right:5px;vertical-align:middle}
.sm-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:8px;border-top:1px solid var(--grid);color:var(--faint);font-size:10.5px}
@media (max-width:1000px){.sm-kpis{grid-template-columns:repeat(3,1fr)}.sm-w8,.sm-w7,.sm-w6,.sm-w5,.sm-w4{grid-column:1/-1}}
@media (max-width:560px){.sm-page{padding:16px;margin:0;border:0}.sm-kpis{grid-template-columns:repeat(2,1fr)}.sm-status{flex-direction:column;gap:0}.sm-status p{padding:0 14px 12px}.sm-tbl{display:block;overflow-x:auto}}
.tab.sum{font-weight:600}
@media print{
  @page{size:A4 landscape;margin:10mm}
  html,body,#app,.work,#view,.scroll{height:auto!important;overflow:visible!important;display:block!important;background:#fff!important}
  .titlebar,.tabs,.ribbon,.sheettabs,.statusbar,.viewbar,.sm-noprint,.copilot,.toast,.login{display:none!important}
  .sm-page{box-shadow:none;border:0;margin:0;padding:0;max-width:none}
  .sm-card,.sm-kpis,.sm-status{break-inside:avoid}
  :root,:root[data-theme]{--bg:#fff;--text:#1d1d1d;--muted:#666;--panel:#f6f7f6;--grid:#dcdcdc;--chrome-2:#e9e9e9}
}

const DAYMS = 864e5;

/* ---- Calendar ---- */
const _calCache = new Map();
function makeCal(cfg, shutdowns) {
  const key = JSON.stringify([cfg.workDays, cfg.holidays, shutdowns || []]);
  if (_calCache.has(key)) return _calCache.get(key);
  const base = D.make(2024, 1, 1), end = D.make(2031, 1, 1), n = end - base;
  const off = new Set((cfg.holidays || []).map(h => h.d));
  (shutdowns || []).forEach(s => { const a = D.fromISO(s.from), b = D.fromISO(s.to || s.from); if (a != null && b != null) for (let i = a; i <= b; i++) off.add(D.iso(i)); });

    isWork: day => { const i = day - base; return i >= 0 && i < n && !!work[i]; },
    ord: day => ordAt[cl(day - base)],             // working days strictly before day (start ordinal)
    ordIncl: day => ordAt[cl(day - base + 1)],     // working days up to and including day (exclusive finish ordinal)
    day: o => dayOf[Math.max(0, Math.min(dayOf.length - 1, o))],
    offReason: day => off.has(D.iso(day))

  _calCache.set(key, cal);
  return cal;
}

/* ---- Workbook parser (ExcelJS workbook → sheet descriptors) ---- */
function _cellDate(cell) {

/* ---------- undo / mutate ---------- */
function snapshot(p) { return { pid: p.id, data: JSON.stringify(serialP(p)) }; }
function mutate(p, fn, opts = {}) {

  S.undo.push(snap); if (S.undo.length > 60) S.undo.shift(); S.redo = [];
  recalc(p);
  if (p._cyclic) { restore(snap); S.undo.pop(); toast('That change creates a circular dependency, so it was undone.', true); return; }
  P.markP(p); if (!opts.norender) renderAll(opts.keepScroll !== false);
}
function restore(snap) { const i = S.projects.findIndex(p => p.id === snap.pid); if (i < 0) return; const np = JSON.parse(snap.data); S.projects[i] = np; recalc(np); }

function redo() { const s = S.redo.pop(); if (!s) return; const p = S.projects.find(x => x.id === s.pid); if (p) S.undo.push(snapshot(p)); restore(s); S.cur = s.pid; P.markP(S.projects.find(x => x.id === s.pid)); renderAll(); toast('Redone'); }

function reportModel(kind) {

  const risks = projs.flatMap(p => (p.risks || []).map(r => ({ p, r })));
  const openRisks = risks.filter(x => x.r.status !== 'Closed');
  const riskTable = { head: [...siteH, 'Risk / issue', 'P', 'I', 'Owner', 'Mitigation', 'Due', 'Status'], rows: openRisks.map(({ p, r }) => [...site(p), r.desc || '', r.prob || '', r.impact || '', r.owner || '', r.mitigation || '', r.due ? fmtDate(D.fromISO(r.due), false) : '', r.status || 'Open']) };

        { h: 'Delayed activities', t: { head: [...siteH, 'Activity', 'Planned finish', '%', 'Overdue (wd)'], rows: delayed.map(({ p, t }) => [...site(p), t.name, fmtDate(t._fd, false), Math.round(t._pct) + '%', String(t._overdue || (t._var > 0 ? t._var : 0))]) } },

}

function dialog({ title, body, wide, buttons = [], onOpen }) {

  const b = $('.body', m); if (typeof body === 'string') b.innerHTML = body; else b.append(body);
  const f = $('footer', m);

  buttons.forEach(bt => { const el = h(`<button class="btn ${bt.pri ? 'pri' : ''}">${esc(bt.l)}</button>`); if (bt.dis) el.disabled = true; el.onclick = () => { if (bt.fn && bt.fn(m) === false) return; close(); }; f.append(el); });
  if (!buttons.length) f.remove();
  $('.x', m).onclick = close; m.onpointerdown = e => { if (e.target === m) close(); };
  const esck = e => { if (e.key === 'Escape') close(); }; document.addEventListener('keydown', esck);
  document.body.append(m); onOpen && onOpen(m, close);
  setTimeout(() => { const fi = m.querySelector('input:not([type=hidden]):not(:disabled),select,textarea'); fi && fi.focus(); }, 0);
  return { m, close };
}

    { name: 'get_tasks', description: 'Tasks for one site. filter: all | delayed | critical | in_progress | upcoming (next 21 days) | supply.', inputSchema: { type: 'object', properties: { site: { type: 'string' }, filter: { type: 'string' } }, required: ['site'] }, execute: ({ site, filter }) => { const p = findProject(String(site)) || curP(); const sd = statusDay(); const f = { delayed: t => t._late, critical: t => t._crit, in_progress: t => t._pct > 0 && t._pct < 100, upcoming: t => t._sd > sd && t._sd <= sd + 21, supply: t => /^S_/.test(t.cat || '') }[filter] || (() => true); return { site: p.name, tasks: p.tasks.filter(t => !t._sum && f(t)).slice(0, 60).map(t => ({ row: t._row, name: t.name, start: D.iso(t._sd), finish: D.iso(t._fd), pct: Math.round(t._pct), slack: t._TF, late: t._late, preds: (t.preds || []).map(l => p._map.get(l.u)?.name + ' ' + l.t), resources: t.res })) }; } },
    { name: 'resource_peaks', description: 'Peak daily load vs max units for each resource across all sites.', inputSchema: { type: 'object', properties: {} }, execute: () => { const { load } = resourceLoad(S.projects); const rm = resMap(); return [...load.entries()].map(([n, m]) => ({ resource: n, peakPct: Math.max(0, ...m.values()), maxUnits: rm.get(n)?.maxUnits ?? 100 })); } }
  ];
  const prompt = `You are the scheduling copilot inside a rooftop solar EPC scheduling app (MS Project style) for "${S.program}". Status date ${D.iso(statusDay())}. The user is viewing ${curP()?.name || 'the portfolio'}. Use the tools to look up facts; never invent dates or numbers. Durations are working days (Mon–Sat). Answer in under 180 words, plain sentences or a short list, no markdown headings.\n\nQuestion: ${q}`;
  try {
    const r = await P.sample(prompt, { tools, cache: false, onText: ({ text }) => { msg.html = esc(text).replace(/\n/g, '<br>'); drawCP(); } });
    msg.html = esc(r.text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
  } catch (e) { msg.html = e && e.code === 'not_granted' ? 'Copilot needs permission to ask Claude. Try again and allow it, or use the quick questions below — those work offline.' : e && e.code === 'rate_limited' ? 'Too many questions in a short time. Wait a moment and try again.' : 'Couldn’t get an answer: ' + esc(e?.message || e); }
  CP.busy = false; drawCP();
}
async function aiNarrative(R) {
  if (!P.sample) return; const el = $('#r-narr'); el.innerHTML = '<p class="dots" style="color:#666">Drafting</p>';
  const data = R.sections.map(s => ({ section: s.h, text: s.p, rows: s.t ? s.t.rows.slice(0, 25) : [] }));
  try { const r = await P.sample(`Write a 4–6 sentence executive narrative for a weekly review of a rooftop solar EPC programme. Be factual, cite numbers from the data, name the biggest delay drivers and the next week's priorities. No headings or bullet points.\n\nDATA:\n${JSON.stringify(data).slice(0, 14000)}`, { cache: false }); el.innerHTML = `<h2>Narrative</h2><p>${esc(r.text)}</p>`; }
  catch (e) { el.innerHTML = `<p style="color:#9b1c1c">Couldn’t draft the narrative${e?.code === 'not_granted' ? ' — permission was declined' : ''}.</p>`; }
}

/* ---- global keys & init ---- */
document.addEventListener('keydown', e => {
  const ctrl = e.ctrlKey || e.metaKey; const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
  if (ctrl && (e.key === 'z' || e.key === 'Z') && !inField && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (ctrl && (e.key === 'y' || e.key === 'Y' || ((e.key === 'z' || e.key === 'Z') && e.shiftKey)) && !inField) { e.preventDefault(); redo(); }
  else if (ctrl && (e.key === 's' || e.key === 'S')) { e.preventDefault(); P.flush(); toast('Saving to SharePoint'); }
  else if (e.key === 'F9') { e.preventDefault(); recalcAll(); renderAll(true); toast('Project recalculated'); }
  else if (e.altKey && (e.key === 'q' || e.key === 'Q')) { e.preventDefault(); toggleCopilot(); }
});
function init() {
  if (innerWidth < 760) S.gridW = 200;
  S.projects = []; S.view = 'summary'; S.tab = 'summary';
  if (AUTH.restore()) startApp(); else showLogin();
}
init();
